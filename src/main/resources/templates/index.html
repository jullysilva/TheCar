<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <th:block layout:fragment="head-extras">
        <title>Lista de Carros</title>
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">🚗 Lista de Carros</h2>
        <a class="btn btn-success" href="/carros/novo">+ Adicionar Carro</a>
    </div>

    <table class="table table-hover table-bordered align-middle bg-white shadow-sm">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Ano</th>
            <th class="text-center">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="carro : ${carros}">
            <td th:text="${carro.id}"></td>
            <td th:text="${carro.marca}"></td>
            <td th:text="${carro.modelo}"></td>
            <td th:text="${carro.ano}"></td>
            <td class="text-center">
                <a class="btn btn-sm btn-warning" 
                   th:href="@{/carros/editar/{id}(id=${carro.id})}">Editar</a>
                <a class="btn btn-sm btn-danger" 
                   th:href="@{/carros/deletar/{id}(id=${carro.id})}"
                   onclick="return confirm('Tem certeza que deseja excluir?')">Excluir</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(carros)}">
            <td colspan="5" class="text-center text-muted">Nenhum carro cadastrado ainda.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
