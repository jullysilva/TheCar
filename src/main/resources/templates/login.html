<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - TheCar</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>

<body>
<div class="login-container">
    <h2 class="login-title">Login - TheCar</h2>

    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Entrar</button>

        <div id="error" class="alert alert-danger mt-3 d-none text-center" role="alert">
            Usuário ou senha incorretos.
        </div>
    </form>
	<div class="text-center mt-3">
	    <a href="/register" class="text-decoration-none">Cadastrar novo usuário</a><br>
	    <a href="#" class="text-muted small">Esqueceu a senha? (em breve)</a>
	</div>

	<div id="expired" class="alert alert-warning mt-3 d-none text-center" role="alert">
	    Sua sessão expirou, faça login novamente.
	</div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Checa se o token expirou (futuro simples)
    const token = localStorage.getItem("token");
    if (token) {
        fetch("/api/check-token", {
            headers: { "Authorization": "Bearer " + token }
        }).then(r => {
            if (r.status === 401) {
                localStorage.removeItem("token");
                document.getElementById("expired").classList.remove("d-none");
            }
        });
    }
</script>
</body>
</html>
